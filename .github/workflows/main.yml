name: Upstream Kernel Merge (v4.9.118)
on:
  workflow_dispatch:

jobs:
  merge_upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Patching Branch
        uses: actions/checkout@v4
        with:
          ref: patching
          fetch-depth: 0 # Important: pulls full history for a proper merge

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge Upstream v4.9.118
        run: |
          # 1. Add the official Android Kernel Common remote
          git remote add upstream https://android.googlesource.com/kernel/common
          
          # 2. Fetch only the specific tag we need to save time/bandwidth
          git fetch upstream tag v4.9.118 --no-tags
          
          # 3. Attempt the merge
          # We use -X theirs to favor upstream changes on minor conflicts, 
          # but Git will still stop if there are major structural conflicts.
          git merge v4.9.118 -m "Merge tag 'v4.9.118' into patching" --allow-unrelated-histories || echo "Merge conflicts detected - manual fix may be needed"

      - name: Finalize and Push
        run: |
          # Force update the Makefile just in case the merge didn't auto-resolve it
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 118/' Makefile
          
          # If the merge is still in progress (due to conflicts), 
          # we add everything and commit to save the state.
          git add .
          if ! git diff-index --quiet HEAD; then
            git commit -m "Upstream: Completed v4.9.118 merge" || echo "Already committed"
            git push origin patching
          else
            echo "No changes to push."
          fi
