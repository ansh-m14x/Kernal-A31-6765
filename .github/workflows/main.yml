name: Sync EROFS Source
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync_erofs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Target Repository (Exfat Branch)
        uses: actions/checkout@v4
        with:
          ref: exfat  # Targets the exfat branch directly
          path: target_repo
          fetch-depth: 0 

      - name: Clone Source Repository (Sparse)
        run: |
          mkdir source_repo && cd source_repo
          git init
          git remote add origin https://github.com/oppo-source/android_kernel_oppo_mt6765
          git config core.sparseCheckout true
          echo "fs/erofs/" >> .git/info/sparse-checkout
          # Pull from the verified Oppo source
          git pull origin oppo/mt6765_r_11.1.4_a16

      - name: Sync Files and Force Push to Exfat
        run: |
          mkdir -p target_repo/fs/erofs
          cp -rv source_repo/fs/erofs/* target_repo/fs/erofs/
          
          cd target_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add fs/erofs/
          
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "fs: backport erofs from mt6765_r_11.1.4_a16"
            # This line forces the push to the exfat branch specifically
            git push origin HEAD:exfat
          else
            echo "No changes detected. Files may already be on the exfat branch."
          fi
