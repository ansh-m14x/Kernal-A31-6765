name: Stable Kernel Cherry-Pick (v4.9.118)
on:
  workflow_dispatch:

jobs:
  cherry_pick_stable:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Patching Branch
        uses: actions/checkout@v4
        with:
          ref: patching
          fetch-depth: 0 # Full history needed for cherry-picking

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --global http.postBuffer 1048576000

      - name: Cherry-Pick 4.9.118 Updates
        run: |
          # 1. Add the stable remote suggested in the guide
          git remote add linux-stable https://kernel.googlesource.com/pub/scm/linux/kernel/git/stable/linux-stable.git
          git fetch linux-stable refs/tags/v4.9.117 refs/tags/v4.9.118 --depth=500
          
          # 2. Cherry-pick the range from 117 to 118
          # We use --strategy=recursive -X ours to automatically skip 
          # code that Oppo already backported (like the KPTI/Spectre fixes)
          git cherry-pick v4.9.117..v4.9.118 --strategy=recursive -X ours || echo "Conflicts found, resolving..."

          # 3. If the cherry-pick pauses on a conflict, we force it through 
          # by keeping your vendor version of the specific file.
          if [ -d ".git/sequencer" ]; then
            git add .
            git cherry-pick --continue --no-edit || git cherry-pick --skip
          fi

      - name: Finalize and Push
        run: |
          # Update Makefile to 118
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 118/' Makefile
          git add Makefile
          git commit -m "Versioning: Update SUBLEVEL to 118" || echo "No changes"
          
          # Push the updated branch
          git push origin patching --force
