name: Swap MediaTek Watchdog Drivers

on:
  workflow_dispatch: # Allows you to trigger this manually from the GitHub Actions tab

jobs:
  replace-drivers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Target Repository (optimized)
        uses: actions/checkout@v4
        with:
          repository: 'ansh-m14x/kernel-oppo-a31'
          ref: 'optimized'
          token: ${{ secrets.GITHUB_TOKEN }}
          path: current-kernel

      - name: Checkout Source Watchdog Driver (test)
        uses: actions/checkout@v4
        with:
          repository: 'ansh-m14x/kernel'
          ref: 'test'
          path: source-watchdog

      - name: Replace Watchdog Code Trees
        run: |
          cd current-kernel
          
          # Remove old driver directories to prevent conflicting remnants
          echo "Cleaning out existing watchdog implementation structures..."
          rm -rf drivers/watchdog/*
          
          # Copy the clean tree from your test branch
          echo "Injecting updated driver architecture..."
          cp -R ../source-watchdog/drivers/watchdog/* drivers/watchdog/
          
          # Verify local Git state changes
          git status

      - name: Commit and Push Changes to Optimized Branch
        run: |
          cd current-kernel
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add drivers/watchdog/
          
          # Commit only if files actually changed
          if ! git diff-index --quiet HEAD; then
            git commit -m "drivers: watchdog: Replace watchdog core infrastructure from test branch"
            git push origin optimized
            echo "Successfully swapped out old driver code!"
          else
            echo "No changes detected. Code identical."
          fi

