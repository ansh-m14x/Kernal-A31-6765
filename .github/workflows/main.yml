name: Xiaomi 4.9.118 Squash Sync
on:
  workflow_dispatch:

jobs:
  squash_sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Patching Branch
        uses: actions/checkout@v4
        with:
          ref: patching
          fetch-depth: 1 

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --global http.postBuffer 1048576000

      - name: Squash Merge Xiaomi 118
        run: |
          git remote add xiaomi https://github.com/xiaomi-mt6765/android_kernel_xiaomi_mt6765.git
          # Fetch only the specific commit to keep it light
          git fetch xiaomi 318867877df9275117e10f3cf485763c37e13c9c --depth=1
          
          # --squash brings in the code changes WITHOUT the heavy history
          git merge FETCH_HEAD --squash --allow-unrelated-histories
          
          # Resolve everything using 'ours' to keep Oppo specific drivers safe
          git checkout --ours . 
          
          # Force the Makefile from the Xiaomi commit to ensure it's 118
          git checkout FETCH_HEAD -- Makefile
          
          git add .
          git commit -m "Upstream: 4.9.118 Sync via Xiaomi MT6765 Squash"

      - name: Push Clean Code
        run: |
          # This push will be extremely small and will NOT fail
          git push origin patching --force
