name: Cleanup Workflow Runs
on:
  workflow_dispatch:
    inputs:
      PAT:
        description: 'Enter your Personal Access Token (PAT)'
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  delete-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete all workflow runs
        env:
          GH_TOKEN: ${{ github.event.inputs.PAT }}
        run: |
          # Get all workflow run IDs
          run_ids=$(gh run list --all --limit 1000 --json databaseId -q '.[].databaseId')
          
          # Delete each run
          for id in $run_ids; do
            echo "Deleting run $id"
            gh run delete "$id"
          done

