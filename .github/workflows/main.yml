name: Sync EROFS Source (Xiaomi mt6765 Port)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync_erofs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Kernel (Exfat Branch)
        uses: actions/checkout@v4
        with:
          ref: exfat
          path: target_repo
          fetch-depth: 0 

      - name: Clone Xiaomi Source Repository (Sparse)
        run: |
          mkdir source_repo && cd source_repo
          git init
          git remote add origin https://github.com/creativchic/android_kernel_xiaomi_mt6765
          git config core.sparseCheckout true
          echo "fs/erofs/" >> .git/info/sparse-checkout
          # Pull from the alps-0.6 branch as requested
          git pull --depth 1 origin alps-0.6

      - name: Purge Old and Sync New EROFS Source
        run: |
          # Completely remove the old, broken EROFS folder
          rm -rf target_repo/fs/erofs
          mkdir -p target_repo/fs/erofs
          
          # Copy the pre-ported source from Xiaomi repo
          cp -rv source_repo/fs/erofs/* target_repo/fs/erofs/
          
          cd target_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add fs/erofs/
          
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "fs: replace erofs with pre-ported source from xiaomi-mt6765 (alps-0.6)"
            git push origin HEAD:exfat
          else
            echo "No changes detected. Source may already be identical."
          fi
