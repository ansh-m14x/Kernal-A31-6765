name: Replace Watchdog Infrastructure

on:
  workflow_dispatch: # Allows manual trigger from any branch

jobs:
  copy-watchdog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Target Kernel (Forced to optimized branch)
        uses: actions/checkout@v4
        with:
          repository: 'ansh-m14x/kernel-oppo-a31'
          ref: 'optimized' # Explicitly locks the workspace target to your optimized branch
          token: ${{ secrets.GITHUB_TOKEN }}
          path: target-kernel

      - name: Checkout Source Watchdog (test branch)
        uses: actions/checkout@v4
        with:
          repository: 'ansh-m14x/kernel'
          ref: 'test'
          path: source-kernel

      - name: Wipe and Replace Watchdog Folder
        run: |
          echo "Cleaning old watchdog structures from target kernel..."
          rm -rf target-kernel/drivers/watchdog/*
          
          echo "Copying optimized watchdog drivers from test branch..."
          cp -R source-kernel/drivers/watchdog/* target-kernel/drivers/watchdog/
          
          cd target-kernel
          git status

      - name: Commit and Force Push to Optimized Branch
        run: |
          cd target-kernel
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add drivers/watchdog/
          
          # Check for changes on the targeted branch layout
          if ! git diff-index --quiet HEAD; then
            git commit -m "drivers: watchdog: Replace with optimized driver infrastructure from test branch"
            # Explicitly push directly to the remote optimized branch tracking reference
            git push origin HEAD:refs/heads/optimized
            echo "Successfully synced and updated the optimized branch layout!"
          else
            echo "No changes detected on the optimized branch. Files are already matching."
          fi
