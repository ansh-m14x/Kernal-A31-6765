name: Stable Kernel Merge (v4.9.118)
on:
  workflow_dispatch:

jobs:
  merge_stable:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Patching Branch
        uses: actions/checkout@v4
        with:
          ref: patching
          fetch-depth: 0 

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Increase buffer for large kernel history push
          git config --global http.postBuffer 524288000

      - name: Merge Tag v4.9.118
        run: |
          # 1. Add the official Linux Stable tree
          git remote add stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
          
          # 2. Fetch the specific tag
          git fetch stable refs/tags/v4.9.118 --no-tags --depth=100
          
          # 3. Perform the merge using the 'ours' strategy for conflicts
          # This ensures that if Oppo/MTK already patched something (like Spectre), 
          # we keep the vendor version to avoid "already defined" errors.
          git merge FETCH_HEAD -m "Merge tag 'v4.9.118' of https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux" \
            --allow-unrelated-histories \
            -X ours

      - name: Finalize Versioning
        run: |
          # Ensure Makefile reflects the new version
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 118/' Makefile
          
          git add .
          if ! git diff-index --quiet HEAD; then
            git commit -m "Upstream: Completed v4.9.118 merge" || echo "No changes"
            # Force push is often needed when merging unrelated histories for the first time
            git push origin patching --force
          else
            echo "Branch is already at 4.9.118."
          fi
