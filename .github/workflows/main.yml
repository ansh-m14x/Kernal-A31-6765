name: Sync KernelSU Source
on:
  workflow_dispatch:

jobs:
  create_and_sync_ksu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create or Reset KSU Branch
        run: |
          # Create ksu branch from current head, force it if it exists
          git checkout -B ksu
          git push origin ksu --force

      - name: Sync from KAGA-KOKO Reference
        run: |
          git remote add ksu_ref https://github.com/KAGA-KOKO/kernel-oppo-a31.git
          git fetch ksu_ref ksu
          
          # Force merge the reference ksu branch into your new ksu branch
          git merge ksu_ref/ksu -X theirs --allow-unrelated-histories -m "Sync: Integrated KernelSU from KAGA-KOKO"
          
          git push origin ksu
