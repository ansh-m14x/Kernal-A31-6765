name: Replace Watchdog Infrastructure

on:
  workflow_dispatch:

jobs:
  copy-watchdog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Target Kernel (Forced to optimized branch)
        uses: actions/checkout@v4
        with:
          repository: 'ansh-m14x/kernel-oppo-a31'
          ref: 'optimized'
          token: ${{ secrets.GITHUB_TOKEN }}
          path: target-kernel

      - name: Checkout Source Watchdog (test branch)
        uses: actions/checkout@v4
        with:
          repository: 'ansh-m14x/kernel'
          ref: 'test'
          path: source-kernel

      - name: Wipe and Force Copy Watchdog Folder
        run: |
          echo "Completely purging standard watchdog folder..."
          rm -rf target-kernel/drivers/watchdog/*
          
          echo "Copying working watchdog files directly from source repo..."
          cp -R source-kernel/drivers/watchdog/* target-kernel/drivers/watchdog/
          
          cd target-kernel
          git status

      - name: Commit and Force Push to Optimized Branch
        run: |
          cd target-kernel
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Force track all changes inside the directory
          git add -A drivers/watchdog/
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "drivers: watchdog: Force apply working watchdog structure from test branch"
            git push origin HEAD:refs/heads/optimized
            echo "Successfully synced and forced the commit onto the optimized branch!"
          else
            echo "Git detected no changes. Ensuring absolute match by forcing an update..."
            # Fallback to verify if any file metadata can be pushed
            git commit --allow-empty -m "drivers: watchdog: Force structural sync with test branch"
            git push origin HEAD:refs/heads/optimized
          fi
