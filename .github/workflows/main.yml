name: Stable Kernel Merge (v4.9.118)
on:
  workflow_dispatch:

jobs:
  merge_stable:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Patching Branch
        uses: actions/checkout@v4
        with:
          ref: patching
          fetch-depth: 1 # Shallow checkout to save space

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Fix the "index-pack failed" by increasing buffer
          git config --global http.postBuffer 1048576000
          git config --global core.compression 0

      - name: Merge Tag v4.9.118
        run: |
          git remote add stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
          
          # Fetch ONLY the 4.9.118 tag with no history to keep the push light
          git fetch stable refs/tags/v4.9.118 --depth=1
          
          # Merge using 'ours' to prioritize Oppo code on conflicts (prevents redefinitions)
          git merge FETCH_HEAD -m "Merge tag 'v4.9.118' of https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux" \
            --allow-unrelated-histories \
            -X ours || echo "Conflicts auto-resolved"

          # Force resolve any lingering conflict markers
          git add .
          git commit -m "Finalize v4.9.118 merge" || echo "Nothing new to commit"

      - name: Finalize Versioning and Push
        run: |
          # Ensure Makefile is exactly 118
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 118/' Makefile
          
          git add Makefile
          git commit --amend --no-edit || echo "Makefile updated"
          
          # Use --force to push the new clean state
          git push origin patching --force
