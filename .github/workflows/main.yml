name: Sync KernelSU Source
on:
  workflow_dispatch:

jobs:
  create_and_sync_ksu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create KSU Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Create and switch to ksu branch, or reset it if it exists
          git checkout -B ksu
          git push origin ksu --force

      - name: Sync from KSU Reference Repo
        run: |
          # Add the reference repo as a remote
          git remote add ksu_ref https://github.com/KAGA-KOKO/kernel-oppo-a31.git
          git fetch ksu_ref ksu
          
          # Merge the KSU changes (using 'theirs' strategy to resolve conflicts automatically)
          git merge ksu_ref/ksu -X theirs --allow-unrelated-histories -m "Sync: Integrated KernelSU from reference repo"
          
          # Push the updated ksu branch
          git push origin ksu
