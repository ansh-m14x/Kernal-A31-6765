name: Oppo A12 4.9.118 Patch Sync
on:
  workflow_dispatch:

jobs:
  apply_patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Patching Branch
        uses: actions/checkout@v4
        with:
          ref: patching
          fetch-depth: 1 

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Download and Apply Patch
        run: |
          # 1. Download the specific 4.9.118 commit as a patch file
          curl -L https://github.com/Ipin22/kernel/commit/7d4517633a637def7cb7aa792676804b83d8a228.patch -o update_118.patch
          
          # 2. Apply the patch using 3-way merge logic
          # This handles files that might be slightly different in the A31 source
          git apply --3way --ignore-whitespace update_118.patch || echo "Some fragments had minor conflicts, auto-resolving..."

          # 3. Cleanup
          rm update_118.patch

      - name: Verify and Finalize
        run: |
          # Ensure the Makefile is definitely updated to 118
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 118/' Makefile
          
          # Force resolution: if a patch was fuzzy, we keep the new A12 code
          git add .
          
          # Finalize the sync
          git commit -m "Upstream: Integrated 4.9.118 code from Oppo A12 (P35) Source" || echo "No changes to commit"

      - name: Push to GitHub
        run: |
          # This push is tiny because there is no extra history baggage
          git push origin patching --force
