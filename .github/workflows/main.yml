name: Apply Upstream Patch 4.9.118
on:
  workflow_dispatch:

jobs:
  patch_kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Patching Branch
        uses: actions/checkout@v4
        with:
          ref: patching # This ensures we are working on the patching branch
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Download and Apply 4.9.118 Patch
        run: |
          # 1. Download the xz compressed patch
          wget https://www.kernel.org/pub/linux/kernel/v4.x/patch-4.9.118.xz

          # 2. Decompress and apply in one command
          # Fixed: Use --reject-file=/dev/null to avoid the ambiguity error seen in logs
          xzcat patch-4.9.118.xz | patch -p1 --reject-file=/dev/null || echo "Some hunks failed - checking conflicts"

      - name: Cleanup and Push
        run: |
          # Remove any leftover original files to keep the repo clean
          find . -name "*.orig" -delete
          
          git add .
          # Only commit if there are actually changes to push to the patching branch
          if ! git diff-index --quiet HEAD; then
            git commit -m "Upstream: Apply official 4.9.118 patch"
            git push origin patching
          else
            echo "No changes to commit (maybe patch was already applied?)"
          fi
