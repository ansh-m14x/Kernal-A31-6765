name: Sync EROFS Source
on:
  workflow_dispatch:

# Ensure the action has permission to write to the repo
permissions:
  contents: write

jobs:
  sync_erofs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          ref: exfat
          path: target_repo
          fetch-depth: 0 # Fetch all history so we can push back

      - name: Clone Source Repository (Sparse)
        run: |
          mkdir source_repo && cd source_repo
          git init
          git remote add origin https://github.com/oppo-source/android_kernel_oppo_mt6765
          git config core.sparseCheckout true
          echo "fs/erofs/" >> .git/info/sparse-checkout
          # Pull the specific branch from Oppo source verified in 11434.jpg
          git pull origin oppo/mt6765_r_11.1.4_a16

      - name: Sync Files and Push to Exfat
        run: |
          # Ensure directory exists in your Oppo A31 source
          mkdir -p target_repo/fs/erofs
          
          # Sync files
          cp -rv source_repo/fs/erofs/* target_repo/fs/erofs/
          
          cd target_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add fs/erofs/
          
          # Only commit and push if there are actual changes
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "fs: backport erofs from mt6765_r_11.1.4_a16"
            git push origin HEAD:exfat
          else
            echo "No changes detected, files might already be there."
          fi
