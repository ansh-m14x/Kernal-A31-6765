name: Oppo A12 Direct File Injection (4.9.118)
on:
  workflow_dispatch:

jobs:
  inject_files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Patching Branch
        uses: actions/checkout@v4
        with:
          ref: patching

      - name: Force Overwrite Critical Files
        run: |
          # The RAW base URL for the Oppo A12 (P35) 4.9.118 commit
          RAW_URL="https://raw.githubusercontent.com/Ipin22/kernel/7d4517633a637def7cb7aa792676804b83d8a228"

          # 1. Update Versioning
          curl -L "$RAW_URL/Makefile" -o Makefile

          # 2. Update Networking (Fixed 4.9.118 versions)
          curl -L "$RAW_URL/net/ipv4/fib_frontend.c" -o net/ipv4/fib_frontend.c
          curl -L "$RAW_URL/net/ipv4/ip_fragment.c" -o net/ipv4/ip_fragment.c
          curl -L "$RAW_URL/net/ipv4/inet_fragment.c" -o net/ipv4/inet_fragment.c
          curl -L "$RAW_URL/net/ipv4/tcp_input.c" -o net/ipv4/tcp_input.c

          # 3. Update Filesystem Security
          curl -L "$RAW_URL/fs/squashfs/block.c" -o fs/squashfs/block.c

          # 4. Update core Architecture (Fixes Spectre/KPTI)
          curl -L "$RAW_URL/arch/arm64/include/asm/mmu.h" -o arch/arm64/include/asm/mmu.h
          curl -L "$RAW_URL/arch/arm64/kernel/cpufeature.c" -o arch/arm64/kernel/cpufeature.c

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          git commit -m "Sync: Force-injected verified 4.9.118 files from Oppo A12 (MT6765)" || echo "Files already up to date"
          
          # This push is tiny and will not hit the 'index-pack' error
          git push origin patching --force
