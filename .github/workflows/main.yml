name: Apply Upstream Patch 4.9.118
on:
  workflow_dispatch:

jobs:
  patch_kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Patching Branch
        uses: actions/checkout@v4
        with:
          ref: patching # Targeting your fresh patching branch
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Download and Apply 4.9.118 Patch
        run: |
          # 1. Download the patch
          wget https://www.kernel.org/pub/linux/kernel/v4.x/patch-4.9.118.xz

          # 2. Apply with duplication protection
          # --forward: Detects if code is already present and skips it
          # --batch: Skips failed hunks without asking questions
          # --reject-file=/dev/null: Discards parts that don't fit to keep tree clean
          xzcat patch-4.9.118.xz | patch -p1 --forward --batch --reject-file=/dev/null || echo "Hunks skipped or already applied"

      - name: Cleanup and Push
        run: |
          # Ensure the version sublevel is updated in the Makefile
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 118/' Makefile
          
          # Remove any leftover original/backup files
          find . -name "*.orig" -delete
          
          git add .
          # Only commit if there are actual new upstream changes
          if ! git diff-index --quiet HEAD; then
            git commit -m "Upstream: Apply official 4.9.118 patch (skipping duplicates)"
            git push origin patching
          else
            echo "No new changes to commit."
          fi
