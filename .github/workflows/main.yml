name: Sync LZ4 & Crypto (Xiaomi mt6765 Port)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync_deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Kernel (Exfat Branch)
        uses: actions/checkout@v4
        with:
          ref: exfat
          path: target_repo
          fetch-depth: 0 

      - name: Clone Xiaomi Source Repository (Sparse)
        run: |
          mkdir source_repo && cd source_repo
          git init
          git remote add origin https://github.com/creativchic/android_kernel_xiaomi_mt6765
          git config core.sparseCheckout true
          # Target the core libraries and headers needed for EROFS
          echo "lib/lz4/" >> .git/info/sparse-checkout
          echo "crypto/" >> .git/info/sparse-checkout
          echo "include/linux/lz4.h" >> .git/info/sparse-checkout
          git pull --depth 1 origin alps-0.6

      - name: Sync Libraries and Headers
        run: |
          # Sync LZ4 Library
          rm -rf target_repo/lib/lz4
          mkdir -p target_repo/lib/lz4
          cp -rv source_repo/lib/lz4/* target_repo/lib/lz4/

          # Sync Crypto (Be careful: copying all of crypto is heavy, but ensures compatibility)
          # We prioritize the lz4-related crypto wrappers if they exist
          cp -rv source_repo/crypto/lz4.c target_repo/crypto/ 2>/dev/null || echo "lz4.c not found in crypto"
          cp -rv source_repo/crypto/lz4hc.c target_repo/crypto/ 2>/dev/null || echo "lz4hc.c not found in crypto"

          # Sync Header
          cp -v source_repo/include/linux/lz4.h target_repo/include/linux/ 2>/dev/null || echo "Header not found"
          
          cd target_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add lib/lz4/ crypto/ include/linux/lz4.h
          
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "lib/crypto: sync lz4 and crypto dependencies from xiaomi-mt6765"
            git push origin HEAD:exfat
          else
            echo "No changes detected."
          fi
