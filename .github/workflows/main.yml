name: Sync EROFS Source
on:
  workflow_dispatch:

jobs:
  sync_erofs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ansh-m14x/kernel-oppo-a31
          ref: exfat  # Corrected from 'branch' to 'ref'
          path: target_repo

      - name: Clone Source Repository (Sparse)
        run: |
          mkdir source_repo && cd source_repo
          git init
          git remote add origin https://github.com/oppo-source/android_kernel_oppo_mt6765
          git config core.sparseCheckout true
          echo "fs/erofs/" >> .git/info/sparse-checkout
          git pull origin oppo/mt6765_r_11.1.4_a16

      - name: Sync Files and Commit
        run: |
          # Create directory if it doesn't exist in target
          mkdir -p target_repo/fs/erofs
          
          # Copy files verified in 11434.jpg
          cp -rv source_repo/fs/erofs/* target_repo/fs/erofs/
          
          cd target_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add fs/erofs/
          git commit -m "fs: backport erofs from mt6765_r_11.1.4_a16" || exit 0
          git push origin exfat
