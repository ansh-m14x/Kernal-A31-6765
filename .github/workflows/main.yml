name: Stable Kernel Merge (v4.9.118)
on:
  workflow_dispatch:

jobs:
  merge_stable:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Patching Branch
        uses: actions/checkout@v4
        with:
          ref: patching
          fetch-depth: 0 

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --global http.postBuffer 524288000

      - name: Merge Tag v4.9.118
        run: |
          # 1. Add the official Linux Stable tree
          git remote add stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
          
          # 2. Fetch the specific tag
          git fetch stable refs/tags/v4.9.118 --no-tags --depth=100
          
          # 3. Attempt merge with ours strategy
          # We use "|| true" to prevent the action from failing when it sees conflicts
          git merge FETCH_HEAD -m "Merge tag 'v4.9.118' of https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux" \
            --allow-unrelated-histories \
            -X ours || echo "Conflicts found, proceeding with force-resolution"

          # 4. FORCE RESOLUTION
          # This stages everything as resolved using the 'ours' (Oppo) logic
          git add .
          
          # 5. Finalize the merge commit
          # This tells Git the merge is done even if it was "interrupted" by conflicts
          git commit -m "Merge tag 'v4.9.118' (Force Resolved Redefinitions)" || echo "Nothing to commit"

      - name: Finalize Versioning and Push
        run: |
          # Force SUBLEVEL update
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 118/' Makefile
          
          git add Makefile
          git commit --amend --no-edit || echo "No changes to Makefile"
          
          # Push the clean 118 history
          git push origin patching --force

