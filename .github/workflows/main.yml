name: Cleanup Workflow Runs
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  delete-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # This fetches the full history

      - name: Delete all workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get all workflow run IDs
          # We use --all to ensure we get runs from all workflow files
          run_ids=$(gh run list --all --limit 1000 --json databaseId -q '.[].databaseId')
          
          for id in $run_ids; do
            echo "Deleting run $id"
            gh run delete "$id" --confirm
          done
