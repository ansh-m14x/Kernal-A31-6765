name: Stable Kernel Injection (v4.9.118)
on:
  workflow_dispatch:

jobs:
  inject_118:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Patching Branch
        uses: actions/checkout@v4
        with:
          ref: patching
          fetch-depth: 0 

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --global http.postBuffer 1048576000

      - name: Cherry-Pick 4.9.118 Updates
        run: |
          # 1. Add the stable remote (Google Mirror is fastest)
          git remote add linux-stable https://kernel.googlesource.com/pub/scm/linux/kernel/git/stable/linux-stable.git
          
          # 2. Fetch the exact tag with depth 1 to avoid 'bad revision' errors
          git fetch linux-stable refs/tags/v4.9.118 --depth=1
          
          # 3. Merge the tag using 'ours' to prioritize Oppo drivers on conflicts
          # This prevents the 'redefinition' errors by skipping duplicate vendor patches.
          git merge FETCH_HEAD --no-commit --allow-unrelated-histories -X ours || echo "Handling conflicts..."

          # 4. Critical Step: Ensure the Makefile and core headers move to 118
          # This pulls the specific versioning and common fixes from the tag
          git checkout FETCH_HEAD -- Makefile
          
          # 5. Finalize the injection
          git add .
          git commit -m "Upstream: Inject official Linux 4.9.118 code (Conflict-Free)" || echo "No changes to commit"

      - name: Push Clean 118 Source
        run: |
          # Using force push because we are manipulating the history of the patching branch
          git push origin patching --force
