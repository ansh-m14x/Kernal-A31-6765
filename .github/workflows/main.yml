name: Stable Kernel Merge (v4.9.118)
on:
  workflow_dispatch:

jobs:
  merge_stable:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Patching Branch
        uses: actions/checkout@v4
        with:
          ref: patching
          fetch-depth: 1 

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --global http.postBuffer 1048576000

      - name: Squash Merge v4.9.118
        run: |
          git remote add stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
          git fetch stable refs/tags/v4.9.118 --depth=1
          
          # --squash: This is the key. It brings in all 118 code as 
          # local changes instead of a heavy history merge.
          git merge FETCH_HEAD --squash --allow-unrelated-histories
          
          # -X ours: Since we are squashing, we manually resolve 
          # any conflicts by favoring the Oppo/MTK side.
          git checkout --ours . 
          git add .
          
          # Create the professional merge commit message
          git commit -m "Merge tag 'v4.9.118' of https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux"

      - name: Finalize Versioning and Push
        run: |
          # Force the Makefile update
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 118/' Makefile
          git add Makefile
          git commit --amend --no-edit || echo "Makefile already correct"
          
          # This push will be VERY small now and won't fail
          git push origin patching --force
