name: Stable Kernel Multi-Commit Sync (v4.9.118)
on:
  workflow_dispatch:

jobs:
  multi_commit_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Patching Branch
        uses: actions/checkout@v4
        with:
          ref: patching
          fetch-depth: 1 

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --global http.postBuffer 1048576000

      - name: Prepare 4.9.118 Source
        run: |
          git remote add linux-stable https://kernel.googlesource.com/pub/scm/linux/kernel/git/stable/linux-stable.git
          git fetch linux-stable refs/tags/v4.9.118 --depth=1
          # Merge changes into worktree without committing
          git merge FETCH_HEAD --no-commit --allow-unrelated-histories -X ours || echo "Merging..."

      - name: "Commit Part 1: Core & Makefile"
        run: |
          git checkout FETCH_HEAD -- Makefile
          git add Makefile kernel/ mm/ include/
          git commit -m "Upstream [1/4]: Core Kernel and Headers (v4.9.118)" || echo "No changes"
          git push origin patching

      - name: "Commit Part 2: Architecture (arm64)"
        run: |
          git add arch/arm64/
          git commit -m "Upstream [2/4]: ARM64 Architecture Updates" || echo "No changes"
          git push origin patching

      - name: "Commit Part 3: Drivers"
        run: |
          git add drivers/
          git commit -m "Upstream [3/4]: Driver Updates" || echo "No changes"
          git push origin patching

      - name: "Commit Part 4: Networking & Cleanup"
        run: |
          git add .
          git commit -m "Upstream [4/4]: Networking and Final Sync" || echo "No changes"
          git push origin patching
