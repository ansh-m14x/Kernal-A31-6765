name: Upstream Kernel Merge (v4.9.118)
on:
  workflow_dispatch:

jobs:
  merge_upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Patching Branch
        uses: actions/checkout@v4
        with:
          ref: patching
          fetch-depth: 0 # Full history is required for a clean merge

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync with Google Source
        run: |
          # 1. Add the official Android Kernel Common remote
          git remote add upstream https://android.googlesource.com/kernel/common
          
          # 2. Fetch the specific commit that defines 4.9.118
          # Commit e01202b36f03 is the official "Linux 4.9.118" tag in Google's tree
          git fetch upstream e01202b36f03f9284ffb51e911f6710d0a62c815 --depth=100
          
          # 3. Merge with 'recursive' strategy to prioritize original vendor code on simple conflicts
          # This prevents the 'redefinition' errors by letting Git realize the code is identical
          git merge FETCH_HEAD -m "Merge tag 'Linux 4.9.118' from Android Common" \
            --allow-unrelated-histories \
            -X ours || echo "Major conflicts detected - proceeding to auto-resolve"

      - name: Fix Redefinition Artifacts
        run: |
          # Even with a clean merge, some vendor headers need a final check
          # This ensures the Makefile is exactly 118
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 118/' Makefile
          
          # Remove any potential .orig files
          find . -name "*.orig" -delete
          
          git add .
          if ! git diff-index --quiet HEAD; then
            git commit -m "Upstream: Completed 4.9.118 sync via Google Source"
            git push origin patching
          else
            echo "No changes needed."
          fi
